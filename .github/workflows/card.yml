name: Atualiza card do perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/card.yml"

permissions:
  contents: write

concurrency:
  group: card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar card com dados do GitHub
        env:
          CARD_TOKEN: ${{ secrets.CARD_TOKEN || github.token }}
          CARD_LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/build_card.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg assets/stats.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza card do perfil"
          git push origin HEAD:${{ github.ref_name }}
